[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagdrift-bisect"
version = "0.1.0"
description = "Version-axis performance archaeology: per-tag measurement, drift detection, single-commit bisect and revert proof"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]

[project.scripts]
tagdrift = "tagdrift.cli:main"

[tool.setuptools]
packages = ["tagdrift"]
